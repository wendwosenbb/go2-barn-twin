# Settings for isaac-idle-check, installed as /etc/default/isaac-idle.
# push-vm-tools.sh only installs this file if it doesn't exist yet, so edits
# made on the VM are kept.

IDLE_MINUTES=30      # power off after this many minutes with nothing active
GPU_BUSY_PCT=30      # average GPU use at or above this counts as busy
SIGNAL_PORT=49100    # Isaac Sim WebRTC signalling port
DRY_RUN=0            # 1 = only log what would happen
